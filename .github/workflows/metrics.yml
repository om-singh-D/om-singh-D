name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Main overview card
      - name: Classic metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          template: classic
          filename: metrics.classic.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

      # 2) Contribution calendar card
      - name: Isocalendar metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          filename: metrics.plugin.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

      # 3) Languages card
      - name: Languages metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          config_timezone: Asia/Kolkata

      # 4) Habits card
      - name: Habits metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          filename: metrics.plugin.habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          config_timezone: Asia/Kolkata

      # 5) Achievements/trophies card
      - name: Achievements metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          filename: metrics.plugin.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: detailed
          config_timezone: Asia/Kolkata

      # 6) Topics card
      - name: Topics metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: om-singh-D
          filename: metrics.plugin.topics.svg
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 18
          plugin_topics_mode: starred
          config_timezone: Asia/Kolkata
